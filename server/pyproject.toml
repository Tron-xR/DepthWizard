[project]
name = "depthwizard-server"
version = "0.1.0"
description = "DepthWizard local inference server - monocular depth -> elevation (DEM/DSM) extraction"
license = { text = "MIT" }
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "filelock>=3.13",
    "requests>=2.31",
    "torch==2.5.1",
    "timm>=1.0.29",
    "transformers>=5.16.1",
    "safetensors>=0.8.0",
    "rasterio>=1.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pyinstaller>=6.22.2",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
