# Frozen acceptance thresholds for the DepthWizard model benchmark.
# Committed before any model work on purpose: the bar is fixed first, the
# model must reach it - not the other way around. Any later edit invalidates
# previous benchmark results (the harness records this file's sha256).
#
# improvement is fractional RMSE reduction vs the prior-degradation baseline
# (native reference block-averaged to the FIRST --prior-res value, default
# 90 m, then cubic-resampled back to the working grid):
#   improvement = (rmse_prior - rmse_candidate) / rmse_prior
# The coarse-DEM-as-reference (bicubic) arms remain for reporting only,
# labeled "reference agreement" - they are self-referential on manifests
# without an independent/higher-resolution reference and are NOT the bar.

benchmark: depthwizard-benchmark-v1
primary_metric: improvement_vs_prior_baseline
minimum_improvement: 0.05
per_stratum_improvement:
  forested: 0.0
  hilly: 0.0
  sparse: 0.0
max_failure_rate: 0.10
min_raw_correlation: 0.20
min_test_sites: 3
bootstrap_iters: 1000
seed: 42
