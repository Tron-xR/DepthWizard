# Frozen acceptance thresholds for the DepthWizard model benchmark.
# Committed before any model work on purpose: the bar is fixed first, the
# model must reach it - not the other way around. Any later edit invalidates
# previous benchmark results (the harness records this file's sha256).
#
# improvement is fractional RMSE reduction vs the bicubic-upsampled reference:
#   improvement = (rmse_bicubic - rmse_candidate) / rmse_bicubic
# On manifests without an independent/higher-resolution reference the bicubic
# arm is self-referential (rmse 0) and improvement is NOT MEASURABLE; the
# verdict says so instead of pretending the threshold was met or missed.

benchmark: depthwizard-benchmark-v1
primary_metric: rmse_delta_vs_bicubic
minimum_improvement: 0.05
per_stratum_improvement:
  forested: 0.0
  hilly: 0.0
  sparse: 0.0
max_failure_rate: 0.10
min_raw_correlation: 0.20
min_test_sites: 3
bootstrap_iters: 1000
seed: 42
