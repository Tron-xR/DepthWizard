# Tests and lint for the Python server.
# The project declares Python 3.10 (server/pyproject.toml requires-python) and
# installs via uv + server/uv.lock, so CI mirrors the documented `cd server && uv run ...` workflow.

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Install dependencies
      working-directory: server
      run: uv sync --frozen
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        # exclude gitignored artifact dirs so lint always scans committed source only
        uv run --project server flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=server/.venv,.venv,unity-client/build,build,dist,unity-client/Assets/StreamingAssets
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run --project server flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=server/.venv,.venv,unity-client/build,build,dist,unity-client/Assets/StreamingAssets
    - name: Test with pytest
      working-directory: server
      run: uv run pytest